apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse_uid
    access: proxy
    orgId: 1
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      username: default
      defaultDatabase: cinema
      protocol: native
    secureJsonData:
      password: ""
    version: 1
    editable: false

  - name: PostgreSQL
    type: postgres
    uid: postgres_uid
    access: proxy
    orgId: 1
    url: postgres:5432
    database: cinema_metrics
    user: cinema
    secureJsonData:
      password: cinema_pass
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 5
      postgresVersion: 1600
      timescaledb: false
    version: 1
    editable: false
