version: '3.8'

services:
  flight-db:
    image: postgres:15-alpine
    container_name: flight-db
    environment:
      POSTGRES_DB: flight_db
      POSTGRES_USER: flight_user
      POSTGRES_PASSWORD: flight_pass
    ports:
      - "5432:5432"
    volumes:
      - flight-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_user -d flight_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-db:
    image: postgres:15-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5433:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    command: redis-server --port 6379
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    command: redis-server --port 6380 --replicaof redis-master 6379
    ports:
      - "6380:6380"
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel:
    image: redis:7-alpine
    container_name: redis-sentinel
    command: >
      sh -c "echo 'port 26379
      sentinel monitor mymaster redis-master 6379 1
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000' > /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    ports:
      - "26379:26379"
    depends_on:
      - redis-master
      - redis-replica

  flight-service:
    build:
      context: ./flight-service
      dockerfile: Dockerfile
    container_name: flight-service
    environment:
      DATABASE_URL: postgresql://flight_user:flight_pass@flight-db:5432/flight_db?sslmode=disable
      REDIS_MASTER: redis-master:6379
      REDIS_SENTINEL: redis-sentinel:26379
      GRPC_PORT: 50051
      GRPC_API_KEY: secret-api-key-12345
      CACHE_TTL: 300
    ports:
      - "50051:50051"
    depends_on:
      flight-db:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    environment:
      DATABASE_URL: postgresql://booking_user:booking_pass@booking-db:5432/booking_db
      FLIGHT_SERVICE_URL: flight-service:50051
      GRPC_API_KEY: secret-api-key-12345
      HTTP_PORT: 8080
      RETRY_MAX_ATTEMPTS: 3
      RETRY_INITIAL_BACKOFF_MS: 100
      CB_FAILURE_THRESHOLD: 5
      CB_TIMEOUT_SECONDS: 30
      CB_HALF_OPEN_MAX_REQUESTS: 1
    ports:
      - "8080:8080"
    depends_on:
      booking-db:
        condition: service_healthy
      flight-service:
        condition: service_started
    restart: unless-stopped

volumes:
  flight-db-data:
  booking-db-data:
