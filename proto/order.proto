syntax = "proto3";

package order;

import "common.proto";

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc ValidateOrderOwnership(ValidateOwnershipRequest) returns (ValidateOwnershipResponse);
}

message GetOrderRequest {
  string order_id = 1;
}

message OrderResponse {
  string id = 1;
  string user_id = 2;
  string status = 3;
  string promo_code_id = 4;
  double total_amount = 5;
  double discount_amount = 6;
  repeated OrderItem items = 7;
  string created_at = 8;
  string updated_at = 9;
}

message OrderItem {
  string id = 1;
  string product_id = 2;
  int32 quantity = 3;
  double price_at_order = 4;
}

message ValidateOwnershipRequest {
  string order_id = 1;
  string user_id = 2;
}

message ValidateOwnershipResponse {
  bool is_owner = 1;
}