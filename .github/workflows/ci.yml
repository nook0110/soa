name: CI — Build, Test, Load Test & Metrics Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CONSUMER_URL: http://localhost:8000
  PROMETHEUS_URL: http://localhost:9090
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  SCHEMA_REGISTRY_URL: http://localhost:8081
  CASSANDRA_HOST: localhost

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Job 1: Build — verify Docker images build cleanly
  # ────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build consumer image
        run: docker build -t warehouse-consumer:ci ./consumer

      - name: Build producer image
        run: docker build -t warehouse-producer:ci ./producer

  # ────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests — no external dependencies
  # ────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: consumer/requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest pytest-timeout
          # Install a minimal subset of consumer deps needed by unit tests
          pip install prometheus-client fastapi

      - name: Run unit tests
        run: pytest tests/test_handlers_unit.py -v --timeout=30

  # ────────────────────────────────────────────────────────────────────────
  # Job 3: Integration + E2E + Load tests — full stack via docker-compose
  # ────────────────────────────────────────────────────────────────────────
  integration-e2e-load:
    name: Integration, E2E & Load Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── Install k6 ──────────────────────────────────────────────────────
      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin k6-v0.49.0-linux-amd64/k6
          k6 version

      # ── Install Python test deps ─────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: consumer/requirements.txt

      - name: Install Python test dependencies
        run: |
          pip install pytest pytest-timeout requests
          pip install -r consumer/requirements.txt

      # ── Start the full stack ─────────────────────────────────────────────
      - name: Start docker-compose stack
        run: |
          docker compose up -d --build \
            zookeeper kafka schema-registry \
            cassandra-1 cassandra-2 cassandra-3 \
            cassandra-init producer consumer \
            prometheus alertmanager
        timeout-minutes: 10

      # ── Wait for consumer to be healthy ─────────────────────────────────
      - name: Wait for consumer /health
        run: |
          echo "Waiting for consumer to be ready..."
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              echo "Consumer is up (HTTP $status)"
              break
            fi
            echo "Attempt $i/60: HTTP $status — waiting..."
            sleep 5
          done
          curl -sf http://localhost:8000/health || true

      # ── Integration tests ────────────────────────────────────────────────
      - name: Run integration tests
        run: |
          pytest tests/test_integration.py -v --timeout=120
        continue-on-error: false

      # ── E2E tests ────────────────────────────────────────────────────────
      - name: Run E2E tests
        run: |
          pytest tests/test_e2e.py -v --timeout=180
        continue-on-error: false

      # ── Load test ────────────────────────────────────────────────────────
      - name: Run k6 load test
        run: |
          k6 run \
            --env CONSUMER_URL=${{ env.CONSUMER_URL }} \
            --out json=load-test-results.json \
            load-tests/load_test.js
        continue-on-error: false

      # ── Metrics validation ───────────────────────────────────────────────
      - name: Validate Prometheus SLI/SLO
        run: |
          python scripts/check_metrics.py \
            --prometheus-url ${{ env.PROMETHEUS_URL }} \
            --wait 15

      # ── Collect logs on failure ──────────────────────────────────────────
      - name: Collect docker-compose logs on failure
        if: failure()
        run: docker compose logs --no-color > docker-compose.log 2>&1

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-results.json
          retention-days: 7

      - name: Upload docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
          retention-days: 7

      # ── Teardown ─────────────────────────────────────────────────────────
      - name: Tear down docker-compose
        if: always()
        run: docker compose down -v
